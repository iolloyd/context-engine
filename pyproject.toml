[project]
name = "context-engine"
version = "0.1.0"
description = "Graph-based context resolution for LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "iolloyd" }]
dependencies = [
    "pydantic>=2.7",
    "sqlite-vec>=0.1.6",
    "anthropic>=0.40.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[project.scripts]
ctx = "context_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
